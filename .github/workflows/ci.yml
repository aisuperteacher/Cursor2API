name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - fix/claude-code-bridge-reliability

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        run: git diff --check HEAD^

      - name: Run worker tests
        run: npm test

      - name: Run sidecar tests
        run: npm run test:sidecar

      - name: Bundle sidecar entrypoint
        run: bun build sidecar/server.ts --target=bun --outfile /tmp/cursor2api-sidecar.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build worker
        run: npm run build

      - name: Build client
        run: npm run build:client

      - name: Check bridge syntax
        run: node --check scripts/cursor-sdk-local-agent-bridge.mjs
